# The engine's analysis configuration is the workspace one. Nothing is relaxed here.
#
# This include is load-bearing and must not be removed: the analyzer resolves options from
# the NEAREST ancestor file, so without it this package falls back to the stock template
# and every fidelity rule in the workspace file -- strict-casts, unused_import: error,
# always_declare_return_types, comment_references -- goes silently inert for exactly the
# package where it matters most. That was the state until 2026-10-08.
#
# The engine's other hard rule, purity, cannot be expressed in this file at all:
# `import 'dart:io'` produces no diagnostic, because dart:io is a core library and no
# dependency lint can fire for it. See tool/check_engine_purity.dart.
include: ../../analysis_options.yaml
