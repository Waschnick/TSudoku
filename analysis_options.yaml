# Workspace-wide analysis options.
#
# Both packages include this file -- and until 2026-10-08 neither did. Each package had
# the stock template `analysis_options.yaml` that `dart create` writes, and the analyzer
# uses the NEAREST ancestor options file, so every rule below was silently inert for all
# package code. Measured: an unused import inside the engine reported as a *warning*
# rather than the `error` configured here. A workspace-root options file is not inherited
# by workspace members; it has to be included explicitly.
#
# The engine additionally has a HARD purity rule that the analyzer cannot express:
# `import 'dart:io'` in a pure Dart package produces no diagnostic at all (measured --
# dart:io is a core library, so no dependency lint fires). tool/check_engine_purity.dart
# exists for exactly that gap and is not optional.
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # A port is judged by fidelity to the original, so anything that silently changes
    # behaviour is an error, not advice.
    unused_import: error
    unused_local_variable: error
    dead_code: error
    unrelated_type_equality_checks: error
    # NOTE: an earlier version of this file carried `division_optimization: error` here,
    # with a comment claiming it guarded the Java/Dart integer-division difference. That
    # lint does not exist in this SDK at all (grep over the whole Flutter SDK: 0 hits), so
    # the entry was dead and the analyzer reported it as an unrecognized diagnostic code --
    # which `--fatal-infos` does not fail on, because it is a warning about the config
    # rather than about the code. Integer division is covered by R-10 review and by the
    # differential trace, not by a lint.

linter:
  rules:
    # Fidelity-oriented
    always_declare_return_types: true
    avoid_dynamic_calls: true
    prefer_final_locals: true
    unnecessary_parenthesis: false   # parens often mirror the Java precedence; keep them
    # Documentation of intent matters more than usual here, because the reference is
    # another language's source file.
    comment_references: true
